name: Backfill date range

on:
  workflow_dispatch:
    inputs:
      date_range_start:
        description: "Start date in YYYY-MM-DD format."
        required: true
        type: string
      date_range_end:
        description: "End date in YYYY-MM-DD format."
        required: true
        type: string
      collect_sources:
        description: "Optional source group filter, for example: lawmaking, motir."
        required: false
        type: string
      deploy_after:
        description: "Build and deploy the site after the range finishes."
        required: false
        type: boolean
        default: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      dates: ${{ steps.dates.outputs.dates }}
    steps:
      - id: dates
        shell: bash
        run: |
          python3 <<'PY' >> "$GITHUB_OUTPUT"
          import datetime as dt
          import json
          import os
          start = dt.date.fromisoformat("${{ github.event.inputs.date_range_start }}")
          end = dt.date.fromisoformat("${{ github.event.inputs.date_range_end }}")
          if start > end:
              raise SystemExit("date_range_start must be before or equal to date_range_end")
          dates = []
          current = start
          while current <= end:
              dates.append(current.isoformat())
              current += dt.timedelta(days=1)
          print("dates=" + json.dumps(dates))
          PY

  collect-date:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target_date: ${{ fromJson(needs.prepare.outputs.dates) }}
    permissions:
      contents: write
    env:
      LAW_OPEN_API_OC: ${{ secrets.LAW_OPEN_API_OC }}
      LAW_OC: ${{ secrets.LAW_OC }}
      KOREAN_LAW_API_KEY: ${{ secrets.KOREAN_LAW_API_KEY }}
      LAWMAKING_OC: ${{ secrets.LAWMAKING_OC }}
      LAWMAKING_BASE: https://www.lawmaking.go.kr/rest
      GWANBO_LIST_URL: ${{ secrets.GWANBO_LIST_URL }}
      DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      NEXT_PUBLIC_BASE_PATH: /kr-reg-change-watch
      COLLECT_SOURCES: ${{ github.event.inputs.collect_sources }}
      FORCE_COLLECT: "1"
      FETCH_LOOKBACK_DAYS: 1
      FETCH_MAX_PAGES: 200
      MOTIR_FETCH_MAX_PAGES: 200
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Install ALIO attachment extractor dependencies
        run: python3 -m pip install --user olefile pypdf

      - name: Check Korean site connectivity
        id: connectivity
        shell: bash
        run: |
          set +e
          urls=(
            "국가법령정보센터 사전 접속 확인|https://www.law.go.kr"
            "국민참여입법센터 사전 접속 확인|https://www.lawmaking.go.kr"
            "대한민국 전자관보 사전 접속 확인|https://open.gwanbo.go.kr"
            "행정안전부 게시판 사전 접속 확인|https://www.mois.go.kr"
            "기획재정부 게시판 사전 접속 확인|https://mofe.go.kr"
            "산업통상부 게시판 사전 접속 확인|https://www.motir.go.kr"
            "ALIO 사전 접속 확인|https://www.alio.go.kr"
            "정책브리핑 RSS 사전 접속 확인|https://www.korea.kr"
          )
          failed=0
          probe_file="${RUNNER_TEMP}/connectivity-${{ matrix.target_date }}.tsv"
          : > "$probe_file"
          for entry in "${urls[@]}"; do
            label="${entry%%|*}"
            url="${entry#*|}"
            code="$(curl -L -4 --http1.1 --connect-timeout 8 --max-time 12 -sS -o /dev/null -w "%{http_code}" "$url" 2>/tmp/connectivity-error || true)"
            if [ "$code" = "000" ] || [ -z "$code" ]; then
              failed=$((failed + 1))
              message="GitHub Actions runner에서 ${url} 접속 실패: $(cat /tmp/connectivity-error)"
              echo "Connectivity failed: $url ($(cat /tmp/connectivity-error))"
              printf '%s\t%s\t%s\t%s\n' "$label" "$url" "error" "$message" >> "$probe_file"
            else
              echo "Connectivity ok: $url HTTP $code"
              printf '%s\t%s\t%s\t%s\n' "$label" "$url" "ok" "HTTP ${code}" >> "$probe_file"
            fi
          done
          if [ "$failed" -ge 5 ]; then
            echo "Too many Korean source sites are unreachable from this runner. Failing this date quickly."
            mkdir -p data/logs
            PROBE_FILE="$probe_file" TARGET_DATE="${{ matrix.target_date }}" python3 <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          probe_file = os.environ["PROBE_FILE"]
          target_date = os.environ["TARGET_DATE"]
          now = datetime.now(timezone.utc).isoformat()
          logs = []
          with open(probe_file, "r", encoding="utf-8") as handle:
              for line in handle:
                  source, url, status, message = line.rstrip("\n").split("\t", 3)
                  logs.append({
                      "source": source,
                      "status": status,
                      "message": message,
                      "count": 0,
                      "at": now,
                      "url": url
                  })
          payload = {
              "date": target_date,
              "attempted_at": now,
              "message": "GitHub Actions runner에서 한국 공공 사이트 다수 접속 실패",
              "logs": logs
          }
          with open(f"data/logs/failed-{target_date}.json", "w", encoding="utf-8") as handle:
              json.dump(payload, handle, ensure_ascii=False, indent=2)
              handle.write("\n")
          PY
            echo "failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect ${{ matrix.target_date }}
        id: collect
        if: steps.connectivity.outputs.failed != 'true'
        continue-on-error: true
        shell: bash
        run: |
          git pull --rebase --autostash origin main
          npm run collect -- --date "${{ matrix.target_date }}" --force

      - name: Update collection status
        if: always()
        run: npm run status:update

      - name: Commit ${{ matrix.target_date }}
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin main
            git add data
            if git diff --cached --quiet; then
              echo "No collected data changes to commit for ${{ matrix.target_date }}."
              exit 0
            fi
            git commit -m "Collect regulatory changes for ${{ matrix.target_date }}"
            if git push; then
              exit 0
            fi
            echo "Push failed on attempt ${attempt}; retrying."
            sleep $((attempt * 5))
          done
          exit 1

      - name: Fail date if collection failed
        if: steps.connectivity.outputs.failed == 'true' || steps.collect.outcome == 'failure'
        run: exit 1

  deploy:
    needs: collect-date
    if: ${{ always() && github.event.inputs.deploy_after != 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      NEXT_PUBLIC_BASE_PATH: /kr-reg-change-watch
      NEXT_PUBLIC_SUBSCRIPTION_API_URL: ${{ secrets.SUBSCRIPTION_API_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Build static app
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - id: deployment
        uses: actions/deploy-pages@v4
