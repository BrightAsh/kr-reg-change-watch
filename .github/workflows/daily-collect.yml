name: Daily collect and deploy

run-name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target_date != '' && format('Daily collect {0}', github.event.inputs.target_date) || 'Daily collect and deploy' }}

on:
  push:
    branches:
      - main
    paths-ignore:
      - "data/**"
  schedule:
    - cron: "0 15 * * *"
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      target_date:
        description: "수집할 날짜(YYYY-MM-DD). 비우면 한국시간 기준 전일을 수집합니다."
        required: false
        type: string
      force:
        description: "이미 일자별 캐시가 있어도 다시 수집합니다."
        required: false
        type: boolean
        default: false
      collect_sources:
        description: "특정 수집 경로만 다시 수집합니다. 예: lawmaking, motir. 비우면 전체 수집합니다."
        required: false
        type: string
      send_mail:
        description: "수집 완료 후 메일 알림을 발송합니다."
        required: false
        type: boolean
        default: true
      mail_to_override:
        description: "테스트 수신 이메일. 비우면 구독 설정을 사용합니다."
        required: false
        type: string
      deploy_site:
        description: "수집 후 웹사이트를 빌드/배포합니다. 테스트 수집만 확인할 때는 false로 실행합니다."
        required: false
        type: boolean
        default: true
      deploy_only:
        description: "수집/상태 갱신 없이 현재 data로 웹사이트만 빌드/배포합니다."
        required: false
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_site == 'false' && format('collection-test-{0}-{1}', github.ref, github.event.inputs.target_date || github.run_id) || 'pages' }}
  cancel-in-progress: false

jobs:
  collect-build-deploy:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_site == 'false' && 'collection-test' || 'github-pages' }}
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      LAW_OPEN_API_OC: ${{ secrets.LAW_OPEN_API_OC }}
      LAW_OC: ${{ secrets.LAW_OC }}
      KOREAN_LAW_API_KEY: ${{ secrets.KOREAN_LAW_API_KEY }}
      LAWMAKING_OC: ${{ secrets.LAWMAKING_OC }}
      LAWMAKING_BASE: https://www.lawmaking.go.kr/rest
      GWANBO_LIST_URL: ${{ secrets.GWANBO_LIST_URL }}
      DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_TIMEOUT_MS: 20000
      MAIL_FROM_EMAIL: ${{ secrets.MAIL_FROM_EMAIL }}
      MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      MAIL_SUBSCRIPTIONS_JSON: ${{ secrets.MAIL_SUBSCRIPTIONS_JSON }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
      MAIL_UNSUBSCRIBE_EMAILS: ${{ secrets.MAIL_UNSUBSCRIBE_EMAILS }}
      SUBSCRIPTION_API_URL: ${{ secrets.SUBSCRIPTION_API_URL }}
      SUBSCRIBER_READ_TOKEN: ${{ secrets.SUBSCRIBER_READ_TOKEN }}
      MAIL_BASE_URL: https://brightash.github.io/kr-reg-change-watch
      MAIL_TO_OVERRIDE: ${{ github.event.inputs.mail_to_override }}
      NEXT_PUBLIC_BASE_PATH: /kr-reg-change-watch
      NEXT_PUBLIC_SUBSCRIPTION_API_URL: ${{ secrets.SUBSCRIPTION_API_URL }}
      FETCH_LOOKBACK_DAYS: 1
      FETCH_RETRIES: 2
      FETCH_TIMEOUT_MS: 30000
      FETCH_CURL_FALLBACK: 1
      FETCH_CURL_FIRST: 1
      FETCH_CURL_ONLY: 0
      FETCH_MAX_PAGES: 200
      MOTIR_FETCH_MAX_PAGES: 200
      BOARD_PAGE_FETCH_ATTEMPTS: 3
      BOARD_FETCH_CURL_ONLY: 0
      BOARD_FETCH_CURL_FALLBACK: 1
      COLLECT_ATTEMPTS: 2
      COLLECT_RETRY_DELAY_SECONDS: 120
      STOP_ON_CRITICAL_CONNECTIVITY: 1
      COLLECT_PREFLIGHT: 0
      COLLECT_PREFLIGHT_TIMEOUT_MS: 5000
      SELECTED_COLLECT_ATTEMPTS: 2
      SELECTED_FETCH_CURL_FIRST: 0
      SELECTED_FETCH_CURL_ONLY: 0
      SELECTED_FETCH_CURL_FALLBACK: 1
      TARGET_DATE: ${{ github.event.inputs.target_date }}
      COLLECT_SOURCES: ${{ github.event.inputs.collect_sources }}
      FORCE_COLLECT: ${{ github.event.inputs.force == 'true' && '1' || '0' }}
      RETRY_FAILED_ONLY: ${{ github.event.inputs.force == 'true' && '0' || '1' }}
      DEPLOY_SITE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_site == 'false' && '0' || '1' }}
      DEPLOY_ONLY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_only == 'true' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Install ALIO attachment extractor dependencies
        run: python3 -m pip install --user olefile pypdf

      - name: Preflight source connectivity
        id: preflight
        if: ${{ github.event_name != 'push' && env.DEPLOY_ONLY != '1' }}
        shell: bash
        run: |
          set +e
          if [ -n "$COLLECT_SOURCES" ]; then
            echo "Skipping broad source preflight for selected collection sources: $COLLECT_SOURCES"
            exit 0
          fi

          if [ -n "$TARGET_DATE" ]; then
            YMD="$(date -u -d "$TARGET_DATE" +%Y%m%d)"
            DOT_DATE="$(date -u -d "$TARGET_DATE" +%-Y.%-m.%-d.)"
          else
            YMD="$(TZ=Asia/Seoul date -d 'yesterday' +%Y%m%d)"
            DOT_DATE="$(TZ=Asia/Seoul date -d 'yesterday' +%-Y.%-m.%-d.)"
          fi

          LAW_OC_VALUE="${LAW_OPEN_API_OC:-${LAW_OC:-${KOREAN_LAW_API_KEY:-}}}"
          LAWMAKING_OC_VALUE="${LAWMAKING_OC:-}"
          FAIL_COUNT=0

          probe_url() {
            local label="$1"
            local url="$2"
            echo "Checking ${label}"
            curl -4 -L --http1.1 --connect-timeout 8 --max-time 20 --retry 1 --retry-all-errors -sS --fail \
              -o /tmp/preflight.out \
              -A "Mozilla/5.0 (compatible; kr-reg-change-watch/0.1; +https://github.com/BrightAsh/kr-reg-change-watch)" \
              -H "accept: application/json, application/xml, text/xml, text/html;q=0.9, */*;q=0.8" \
              -H "accept-language: ko-KR,ko;q=0.9,en;q=0.8" \
              "$url"
            local code=$?
            local bytes=0
            if [ -f /tmp/preflight.out ]; then
              bytes=$(wc -c < /tmp/preflight.out | tr -d ' ')
            fi
            rm -f /tmp/preflight.out
            if [ "$code" -eq 0 ]; then
              echo "OK ${label} bytes=${bytes}"
            else
              echo "FAIL ${label} curl_exit=${code}"
              FAIL_COUNT=$((FAIL_COUNT + 1))
            fi
          }

          probe_url "law.go.kr" "https://www.law.go.kr/DRF/lawSearch.do?OC=${LAW_OC_VALUE}&target=lsHstInf&type=JSON&display=100&page=1&regDt=${YMD}"
          probe_url "lawmaking.go.kr" "https://www.lawmaking.go.kr/rest/ogLmPp.xml?OC=${LAWMAKING_OC_VALUE}&cptOfiOrgCd=1170000&stYdFmt=${DOT_DATE}&edYdFmt=${DOT_DATE}"
          probe_url "alio.go.kr" "https://www.alio.go.kr/etc/findEtcLawList.json?type=title&pageNo=1"
          probe_url "motir.go.kr" "https://www.motir.go.kr/kor/article/ATCLc01b2a9d8"
          probe_url "korea.kr" "http://www.korea.kr/rss/pressrelease.xml"

          if [ "$FAIL_COUNT" -ge 3 ]; then
            echo "::error::Preflight failed for ${FAIL_COUNT} representative source hosts. This runner cannot reach core public sources; aborting before writing partial collection data."
            exit 1
          fi
          echo "Preflight passed with ${FAIL_COUNT} failure(s)."

      - name: Collect official changes
        id: collect
        if: ${{ github.event_name != 'push' && env.DEPLOY_ONLY != '1' }}
        continue-on-error: true
        run: |
          if [ -n "$COLLECT_SOURCES" ]; then
            export FETCH_CURL_FIRST="${SELECTED_FETCH_CURL_FIRST:-0}"
            export FETCH_CURL_ONLY="${SELECTED_FETCH_CURL_ONLY:-0}"
            export FETCH_CURL_FALLBACK="${SELECTED_FETCH_CURL_FALLBACK:-1}"
          fi

          build_collect_args() {
            COLLECT_ARGS=()
            if [ -n "$TARGET_DATE" ]; then
              COLLECT_ARGS+=(--date "$TARGET_DATE")
            fi
            if [ "$FORCE_COLLECT" = "1" ]; then
              COLLECT_ARGS+=(--force)
            fi
            if [ "$RETRY_FAILED_ONLY" = "1" ]; then
              COLLECT_ARGS+=(--retry-failed)
            fi
          }

          run_collect_once() {
            build_collect_args
            if [ "${#COLLECT_ARGS[@]}" -gt 0 ]; then
              npm run collect -- "${COLLECT_ARGS[@]}"
            else
              npm run collect
            fi
          }

          verify_target_date() {
            if [ -n "$TARGET_DATE" ]; then
              npm run status:verify -- --date "$TARGET_DATE"
            else
              npm run status:verify
            fi
          }

          check_critical_connectivity() {
            if [ -n "$TARGET_DATE" ]; then
              npm run status:critical -- --date "$TARGET_DATE"
            else
              npm run status:critical
            fi
          }

          ATTEMPTS="${COLLECT_ATTEMPTS:-1}"
          if [ -n "$COLLECT_SOURCES" ]; then
            ATTEMPTS="${SELECTED_COLLECT_ATTEMPTS:-1}"
          fi
          DELAY_SECONDS="${COLLECT_RETRY_DELAY_SECONDS:-60}"
          for attempt in $(seq 1 "$ATTEMPTS"); do
            echo "Collection attempt ${attempt}/${ATTEMPTS}"
            set +e
            run_collect_once
            collect_status=$?
            npm run status:update
            verify_target_date
            verify_status=$?
            critical_status=1
            if [ "$verify_status" -ne 0 ] && [ "${STOP_ON_CRITICAL_CONNECTIVITY:-1}" = "1" ]; then
              check_critical_connectivity
              critical_status=$?
            fi
            set -e
            if [ "$collect_status" -eq 0 ] && [ "$verify_status" -eq 0 ]; then
              exit 0
            fi
            if [ "$critical_status" -eq 0 ]; then
              echo "::warning::Critical source connectivity failure detected. Ending this runner attempt so a later workflow run can retry unfinished routes on a fresh runner."
              exit 1
            fi
            if [ "$attempt" -lt "$ATTEMPTS" ]; then
              echo "::warning::Collection attempt ${attempt} left the target incomplete. Retrying unfinished routes after ${DELAY_SECONDS}s."
              sleep "$DELAY_SECONDS"
            fi
          done
          exit 1

      - name: Update collection status
        if: ${{ always() && github.event_name != 'push' && env.DEPLOY_ONLY != '1' && steps.preflight.outcome == 'success' }}
        run: npm run status:update

      - name: Commit collected data
        if: ${{ always() && github.event_name != 'push' && env.DEPLOY_ONLY != '1' && steps.preflight.outcome == 'success' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}"
          npm run status:update
          if grep -R -n -E '^(<<<<<<<|=======|>>>>>>>)' data; then
            echo "::error::Conflict markers found in generated data files."
            exit 1
          fi
          git add data
          if git diff --cached --quiet; then
            echo "No collected data changes to commit."
          else
            DATE_LABEL="${TARGET_DATE:-manual}"
            git commit -m "Collect regulatory changes for ${DATE_LABEL}"
            for push_attempt in 1 2 3; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}"
              if git push; then
                break
              fi
              if [ "$push_attempt" -eq 3 ]; then
                echo "::error::Failed to push collected data after ${push_attempt} attempts."
                exit 1
              fi
              sleep $((push_attempt * 10))
            done
          fi

      - name: Verify target date completeness
        id: verify
        if: ${{ always() && github.event_name != 'push' && env.DEPLOY_ONLY != '1' && steps.preflight.outcome == 'success' }}
        run: |
          if [ -n "$TARGET_DATE" ]; then
            npm run status:verify -- --date "$TARGET_DATE"
          else
            npm run status:verify
          fi

      - name: Send mail alerts
        if: ${{ steps.collect.outcome == 'success' && steps.verify.outcome == 'success' && ((github.event_name == 'schedule' && github.event.schedule == '0 15 * * *') || github.event.inputs.send_mail == 'true') }}
        run: |
          if [ -n "$TARGET_DATE" ]; then
            npm run mail:send -- --date "$TARGET_DATE"
          else
            npm run mail:send
          fi

      - name: Build static website
        if: ${{ always() && env.DEPLOY_SITE == '1' }}
        run: npm run build

      - uses: actions/configure-pages@v5
        if: ${{ always() && env.DEPLOY_SITE == '1' }}

      - uses: actions/upload-pages-artifact@v3
        if: ${{ always() && env.DEPLOY_SITE == '1' }}
        with:
          path: out

      - id: deployment
        if: ${{ always() && env.DEPLOY_SITE == '1' }}
        uses: actions/deploy-pages@v4

      - name: Fail if collection failed
        if: ${{ always() && github.event_name != 'push' && env.DEPLOY_ONLY != '1' && (steps.collect.outcome == 'failure' || steps.verify.outcome == 'failure') }}
        run: exit 1
