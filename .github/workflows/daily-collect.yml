name: Daily collect and deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - "data/**"
  schedule:
    - cron: "0 15 * * *"
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      target_date:
        description: "수집할 날짜(YYYY-MM-DD). 비우면 한국시간 기준 전일을 수집합니다."
        required: false
        type: string
      force:
        description: "이미 일자별 캐시가 있어도 다시 수집합니다."
        required: false
        type: boolean
        default: false
      collect_sources:
        description: "특정 수집 경로만 다시 수집합니다. 예: lawmaking, motir. 비우면 전체 수집합니다."
        required: false
        type: string
      send_mail:
        description: "수집 완료 후 메일 알림을 발송합니다."
        required: false
        type: boolean
        default: true
      mail_to_override:
        description: "테스트 수신 이메일. 비우면 구독 설정을 사용합니다."
        required: false
        type: string
      deploy_site:
        description: "수집 후 웹사이트를 빌드/배포합니다. 테스트 수집만 확인할 때는 false로 실행합니다."
        required: false
        type: boolean
        default: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect-build-deploy:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      LAW_OPEN_API_OC: ${{ secrets.LAW_OPEN_API_OC }}
      LAW_OC: ${{ secrets.LAW_OC }}
      KOREAN_LAW_API_KEY: ${{ secrets.KOREAN_LAW_API_KEY }}
      LAWMAKING_OC: ${{ secrets.LAWMAKING_OC }}
      LAWMAKING_BASE: https://www.lawmaking.go.kr/rest
      GWANBO_LIST_URL: ${{ secrets.GWANBO_LIST_URL }}
      DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      MAIL_FROM_EMAIL: ${{ secrets.MAIL_FROM_EMAIL }}
      MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      MAIL_SUBSCRIPTIONS_JSON: ${{ secrets.MAIL_SUBSCRIPTIONS_JSON }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
      MAIL_UNSUBSCRIBE_EMAILS: ${{ secrets.MAIL_UNSUBSCRIBE_EMAILS }}
      SUBSCRIPTION_API_URL: ${{ secrets.SUBSCRIPTION_API_URL }}
      SUBSCRIBER_READ_TOKEN: ${{ secrets.SUBSCRIBER_READ_TOKEN }}
      MAIL_BASE_URL: https://brightash.github.io/kr-reg-change-watch
      MAIL_TO_OVERRIDE: ${{ github.event.inputs.mail_to_override }}
      NEXT_PUBLIC_BASE_PATH: /kr-reg-change-watch
      NEXT_PUBLIC_SUBSCRIPTION_API_URL: ${{ secrets.SUBSCRIPTION_API_URL }}
      FETCH_LOOKBACK_DAYS: 1
      FETCH_RETRIES: 1
      FETCH_TIMEOUT_MS: 15000
      FETCH_CURL_FALLBACK: 0
      COLLECT_PREFLIGHT_TIMEOUT_MS: 8000
      TARGET_DATE: ${{ github.event.inputs.target_date }}
      COLLECT_SOURCES: ${{ github.event.inputs.collect_sources }}
      FORCE_COLLECT: ${{ github.event.inputs.force == 'true' && '1' || '0' }}
      RETRY_FAILED_ONLY: ${{ github.event_name == 'schedule' && github.event.schedule == '0 23 * * *' && '1' || '0' }}
      DEPLOY_SITE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_site == 'false' && '0' || '1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Install ALIO attachment extractor dependencies
        run: python3 -m pip install --user olefile pypdf

      - name: Collect official changes
        id: collect
        if: github.event_name != 'push'
        continue-on-error: true
        run: |
          if [ -n "$TARGET_DATE" ]; then
            if [ "$FORCE_COLLECT" = "1" ]; then
              npm run collect -- --date "$TARGET_DATE" --force
            else
              npm run collect -- --date "$TARGET_DATE"
            fi
          else
            if [ "$FORCE_COLLECT" = "1" ]; then
              npm run collect -- --force
            else
              npm run collect
            fi
          fi

      - name: Update collection status
        if: ${{ always() && github.event_name != 'push' }}
        run: npm run status:update

      - name: Commit collected data
        if: ${{ always() && github.event_name != 'push' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add data
          if git diff --cached --quiet; then
            echo "No collected data changes to commit."
          else
            DATE_LABEL="${TARGET_DATE:-manual}"
            git commit -m "Collect regulatory changes for ${DATE_LABEL}"
            git push
          fi

      - name: Send mail alerts
        if: ${{ steps.collect.outcome == 'success' && ((github.event_name == 'schedule' && github.event.schedule == '0 15 * * *') || github.event.inputs.send_mail == 'true') }}
        run: |
          if [ -n "$TARGET_DATE" ]; then
            npm run mail:send -- --date "$TARGET_DATE"
          else
            npm run mail:send
          fi

      - name: Build static website
        if: ${{ always() && env.DEPLOY_SITE == '1' }}
        run: npm run build

      - uses: actions/configure-pages@v5
        if: ${{ always() && env.DEPLOY_SITE == '1' }}

      - uses: actions/upload-pages-artifact@v3
        if: ${{ always() && env.DEPLOY_SITE == '1' }}
        with:
          path: out

      - id: deployment
        if: ${{ always() && env.DEPLOY_SITE == '1' }}
        uses: actions/deploy-pages@v4

      - name: Fail if collection failed
        if: ${{ always() && github.event_name != 'push' && steps.collect.outcome == 'failure' }}
        run: exit 1
