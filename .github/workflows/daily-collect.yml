name: Daily collect and deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - "data/**"
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      target_date:
        description: "수집할 날짜(YYYY-MM-DD). 비우면 한국시간 기준 전일을 수집합니다."
        required: false
        type: string
      date_range_start:
        description: "여러 날짜를 다시 수집할 때 시작일(YYYY-MM-DD)."
        required: false
        type: string
      date_range_end:
        description: "여러 날짜를 다시 수집할 때 종료일(YYYY-MM-DD)."
        required: false
        type: string
      force:
        description: "이미 일자별 캐시가 있어도 다시 수집합니다."
        required: false
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect-build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      LAW_OPEN_API_OC: ${{ secrets.LAW_OPEN_API_OC }}
      LAW_OC: ${{ secrets.LAW_OC }}
      KOREAN_LAW_API_KEY: ${{ secrets.KOREAN_LAW_API_KEY }}
      LAWMAKING_OC: ${{ secrets.LAWMAKING_OC }}
      LAWMAKING_BASE: https://www.lawmaking.go.kr/rest
      GWANBO_LIST_URL: ${{ secrets.GWANBO_LIST_URL }}
      DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      NEXT_PUBLIC_BASE_PATH: /kr-reg-change-watch
      FETCH_LOOKBACK_DAYS: 1
      TARGET_DATE: ${{ github.event.inputs.target_date }}
      TARGET_DATE_RANGE_START: ${{ github.event.inputs.date_range_start }}
      TARGET_DATE_RANGE_END: ${{ github.event.inputs.date_range_end }}
      FORCE_COLLECT: ${{ github.event.inputs.force == 'true' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Install ALIO attachment extractor dependencies
        if: github.event_name != 'push'
        run: python3 -m pip install --user olefile pypdf

      - name: Collect official changes
        if: github.event_name != 'push'
        run: |
          if [ -n "$TARGET_DATE_RANGE_START" ] && [ -n "$TARGET_DATE_RANGE_END" ]; then
            current="$TARGET_DATE_RANGE_START"
            while [ "$(date -d "$current" +%s)" -le "$(date -d "$TARGET_DATE_RANGE_END" +%s)" ]; do
              echo "Collecting $current"
              if [ "$FORCE_COLLECT" = "1" ]; then
                npm run collect -- --date "$current" --force
              else
                npm run collect -- --date "$current"
              fi
              current="$(date -I -d "$current + 1 day")"
            done
          elif [ -n "$TARGET_DATE" ]; then
            if [ "$FORCE_COLLECT" = "1" ]; then
              npm run collect -- --date "$TARGET_DATE" --force
            else
              npm run collect -- --date "$TARGET_DATE"
            fi
          else
            npm run collect
          fi

      - name: Commit collected data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add data
          if git diff --cached --quiet; then
            echo "No collected data changes to commit."
          else
            if [ -n "$TARGET_DATE_RANGE_START" ] && [ -n "$TARGET_DATE_RANGE_END" ]; then
              DATE_LABEL="${TARGET_DATE_RANGE_START}_to_${TARGET_DATE_RANGE_END}"
            else
              DATE_LABEL="${TARGET_DATE:-scheduled}"
            fi
            git commit -m "Collect regulatory changes for ${DATE_LABEL}"
            git push
          fi

      - name: Build static app
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - id: deployment
        uses: actions/deploy-pages@v4
