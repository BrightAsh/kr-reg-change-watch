name: Daily collect and deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - "data/**"
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      target_date:
        description: "수집할 날짜(YYYY-MM-DD). 비우면 한국시간 기준 전일을 수집합니다."
        required: false
        type: string
      date_range_start:
        description: "여러 날짜를 다시 수집할 때 시작일(YYYY-MM-DD)."
        required: false
        type: string
      date_range_end:
        description: "여러 날짜를 다시 수집할 때 종료일(YYYY-MM-DD)."
        required: false
        type: string
      force:
        description: "이미 일자별 캐시가 있어도 다시 수집합니다."
        required: false
        type: boolean
        default: false
      collect_sources:
        description: "특정 수집 경로만 다시 수집합니다. 예: lawmaking, motir. 비우면 전체 수집합니다."
        required: false
        type: string
      send_mail:
        description: "수집 완료 후 메일 알림을 발송합니다."
        required: false
        type: boolean
        default: true
      mail_to_override:
        description: "테스트 수신 이메일. 비우면 Secret의 구독 설정을 사용합니다."
        required: false
        type: string

      backfill_mode:
        description: "Internal option for date-range child runs."
        required: false
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect-build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      LAW_OPEN_API_OC: ${{ secrets.LAW_OPEN_API_OC }}
      LAW_OC: ${{ secrets.LAW_OC }}
      KOREAN_LAW_API_KEY: ${{ secrets.KOREAN_LAW_API_KEY }}
      LAWMAKING_OC: ${{ secrets.LAWMAKING_OC }}
      LAWMAKING_BASE: https://www.lawmaking.go.kr/rest
      GWANBO_LIST_URL: ${{ secrets.GWANBO_LIST_URL }}
      DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      MAIL_FROM_EMAIL: ${{ secrets.MAIL_FROM_EMAIL }}
      MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      MAIL_SUBSCRIPTIONS_JSON: ${{ secrets.MAIL_SUBSCRIPTIONS_JSON }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
      MAIL_UNSUBSCRIBE_EMAILS: ${{ secrets.MAIL_UNSUBSCRIBE_EMAILS }}
      SUBSCRIPTION_API_URL: ${{ secrets.SUBSCRIPTION_API_URL }}
      SUBSCRIBER_READ_TOKEN: ${{ secrets.SUBSCRIBER_READ_TOKEN }}
      MAIL_BASE_URL: https://brightash.github.io/kr-reg-change-watch
      MAIL_TO_OVERRIDE: ${{ github.event.inputs.mail_to_override }}
      NEXT_PUBLIC_BASE_PATH: /kr-reg-change-watch
      NEXT_PUBLIC_SUBSCRIPTION_API_URL: ${{ secrets.SUBSCRIPTION_API_URL }}
      FETCH_LOOKBACK_DAYS: 1
      TARGET_DATE: ${{ github.event.inputs.target_date }}
      TARGET_DATE_RANGE_START: ${{ github.event.inputs.date_range_start }}
      TARGET_DATE_RANGE_END: ${{ github.event.inputs.date_range_end }}
      COLLECT_SOURCES: ${{ github.event.inputs.collect_sources }}
      FORCE_COLLECT: ${{ github.event.inputs.force == 'true' && '1' || '0' }}
      BACKFILL_MODE: ${{ github.event.inputs.backfill_mode == 'true' && '1' || '0' }}
      FETCH_RETRIES: ${{ github.event.inputs.backfill_mode == 'true' && '1' || '' }}
      FETCH_TIMEOUT_MS: ${{ github.event.inputs.backfill_mode == 'true' && '10000' || '' }}
      FETCH_CURL_FALLBACK: ${{ github.event.inputs.backfill_mode == 'true' && '0' || '' }}
      FETCH_MAX_PAGES: ${{ github.event.inputs.backfill_mode == 'true' && '200' || '' }}
      MOTIR_FETCH_MAX_PAGES: ${{ github.event.inputs.backfill_mode == 'true' && '200' || '' }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Install ALIO attachment extractor dependencies
        if: github.event_name != 'push'
        run: python3 -m pip install --user olefile pypdf

      - name: Collect official changes
        if: github.event_name != 'push'
        run: |
          if [ -n "$TARGET_DATE_RANGE_START" ] && [ -n "$TARGET_DATE_RANGE_END" ]; then
            range_label="${TARGET_DATE_RANGE_START}_to_${TARGET_DATE_RANGE_END}"
            run_log="data/collection-runs/${range_label}.log"
            mkdir -p data/collection-runs
            : > "$run_log"
            current="$TARGET_DATE_RANGE_START"
            while [ "$(date -d "$current" +%s)" -le "$(date -d "$TARGET_DATE_RANGE_END" +%s)" ]; do
              echo "Dispatching single-date backfill for $current"
              payload="$(jq -n \
                --arg ref "${GITHUB_REF_NAME}" \
                --arg date "$current" \
                --arg sources "$COLLECT_SOURCES" \
                --arg mail_to "$MAIL_TO_OVERRIDE" \
                '{ref: $ref, inputs: {target_date: $date, force: "true", collect_sources: $sources, send_mail: "false", mail_to_override: $mail_to, backfill_mode: "true"}}')"
              curl --fail-with-body -sS -X POST \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/daily-collect.yml/dispatches" \
                -d "$payload"
              echo "$current status=dispatched" | tee -a "$run_log"
              current="$(date -I -d "$current + 1 day")"
              sleep 2
            done
            dispatched_count="$(grep -c ' status=dispatched' "$run_log" || true)"
            {
              echo "### Date range dispatch result"
              echo ""
              echo "- Dispatched single-date backfill runs: ${dispatched_count}"
              echo "- Range: ${TARGET_DATE_RANGE_START} to ${TARGET_DATE_RANGE_END}"
              echo ""
              echo "Each date now runs as its own workflow run with a fresh GitHub runner."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "$TARGET_DATE" ]; then
            if [ "$FORCE_COLLECT" = "1" ]; then
              npm run collect -- --date "$TARGET_DATE" --force
            else
              npm run collect -- --date "$TARGET_DATE"
            fi
          else
            npm run collect
          fi

      - name: Commit collected data
        if: ${{ github.event_name != 'push' && !(github.event_name == 'workflow_dispatch' && github.event.inputs.date_range_start != '' && github.event.inputs.date_range_end != '') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add data
          if git diff --cached --quiet; then
            echo "No collected data changes to commit."
          else
            if [ -n "$TARGET_DATE_RANGE_START" ] && [ -n "$TARGET_DATE_RANGE_END" ]; then
              DATE_LABEL="${TARGET_DATE_RANGE_START}_to_${TARGET_DATE_RANGE_END}"
            else
              DATE_LABEL="${TARGET_DATE:-scheduled}"
            fi
            git commit -m "Collect regulatory changes for ${DATE_LABEL}"
            git push
          fi

      - name: Send mail alerts
        if: ${{ (github.event_name == 'schedule' || github.event.inputs.send_mail == 'true') && !(github.event_name == 'workflow_dispatch' && github.event.inputs.date_range_start != '' && github.event.inputs.date_range_end != '') }}
        run: |
          if [ -n "$TARGET_DATE_RANGE_START" ] && [ -n "$TARGET_DATE_RANGE_END" ]; then
            failure_log="data/collection-failures/${TARGET_DATE_RANGE_START}_to_${TARGET_DATE_RANGE_END}.log"
            current="$TARGET_DATE_RANGE_START"
            while [ "$(date -d "$current" +%s)" -le "$(date -d "$TARGET_DATE_RANGE_END" +%s)" ]; do
              if [ -s "$failure_log" ] && grep -q "^${current} " "$failure_log"; then
                echo "Skipping mail alert for failed collection date $current"
                current="$(date -I -d "$current + 1 day")"
                continue
              fi
              echo "Sending mail alert for $current"
              npm run mail:send -- --date "$current"
              current="$(date -I -d "$current + 1 day")"
            done
          elif [ -n "$TARGET_DATE" ]; then
            npm run mail:send -- --date "$TARGET_DATE"
          else
            npm run mail:send
          fi

      - name: Build static app
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.date_range_start != '' && github.event.inputs.date_range_end != '') }}
        run: npm run build

      - uses: actions/configure-pages@v5
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.date_range_start != '' && github.event.inputs.date_range_end != '') }}

      - uses: actions/upload-pages-artifact@v3
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.date_range_start != '' && github.event.inputs.date_range_end != '') }}
        with:
          path: out

      - id: deployment
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.date_range_start != '' && github.event.inputs.date_range_end != '') }}
        uses: actions/deploy-pages@v4
