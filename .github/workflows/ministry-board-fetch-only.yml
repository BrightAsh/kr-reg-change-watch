name: Ministry board fetch only

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "Target date (YYYY-MM-DD). Leave empty when using a range."
        required: false
        type: string
      date_range_start:
        description: "Range start date (YYYY-MM-DD)"
        required: false
        type: string
      date_range_end:
        description: "Range end date (YYYY-MM-DD)"
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      NEXT_PUBLIC_BASE_PATH: /kr-reg-change-watch
      COLLECT_SOURCES: ministry-board
      FORCE_COLLECT: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Sync latest main
        run: git pull --ff-only origin main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Fetch ministry board data
        run: |
          if [ -n "${{ github.event.inputs.date_range_start }}" ] && [ -n "${{ github.event.inputs.date_range_end }}" ]; then
            current="${{ github.event.inputs.date_range_start }}"
            while [ "$(date -d "$current" +%s)" -le "$(date -d "${{ github.event.inputs.date_range_end }}" +%s)" ]; do
              echo "Fetching ministry-board $current"
              npx tsx scripts/fetch.ts --date "$current" --force
              current="$(date -I -d "$current + 1 day")"
            done
          elif [ -n "${{ github.event.inputs.target_date }}" ]; then
            npx tsx scripts/fetch.ts --date "${{ github.event.inputs.target_date }}" --force
          else
            npx tsx scripts/fetch.ts --force
          fi

      - name: Commit fetched data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No ministry board data changes to commit."
          else
            git commit -m "Fetch ministry board data"
            git pull --rebase origin main
            git push
          fi

      - name: Build static app
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - id: deployment
        uses: actions/deploy-pages@v4