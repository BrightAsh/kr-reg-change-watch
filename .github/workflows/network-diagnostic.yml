name: Network diagnostics

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "Date to probe in YYYY-MM-DD format."
        required: true
        default: "2026-04-01"
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      LAW_OPEN_API_OC: ${{ secrets.LAW_OPEN_API_OC }}
      LAW_OC: ${{ secrets.LAW_OC }}
      KOREAN_LAW_API_KEY: ${{ secrets.KOREAN_LAW_API_KEY }}
      LAWMAKING_OC: ${{ secrets.LAWMAKING_OC }}
      LAWMAKING_BASE: https://www.lawmaking.go.kr/rest
      GWANBO_LIST_URL: ${{ secrets.GWANBO_LIST_URL }}
      DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
    steps:
      - name: Probe configured endpoints
        shell: bash
        run: |
          set +e

          for secret in "$LAW_OPEN_API_OC" "$LAW_OC" "$KOREAN_LAW_API_KEY" "$LAWMAKING_OC" "$DATA_GO_KR_SERVICE_KEY"; do
            if [ -n "$secret" ]; then
              echo "::add-mask::$secret"
            fi
          done

          target_date="${{ github.event.inputs.target_date }}"
          ymd="${target_date//-/}"
          dot_date="$(date -d "$target_date" '+%Y.%-m.%-d.')"
          law_oc="${LAW_OPEN_API_OC:-${LAW_OC:-$KOREAN_LAW_API_KEY}}"
          lawmaking_base="${LAWMAKING_BASE%/}"
          gwanbo_base="${GWANBO_LIST_URL:-https://open.gwanbo.go.kr/OpenApi/ApiTotalService/getApiTotalList}"

          urlencode() {
            python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$1"
          }

          law_oc_encoded="$(urlencode "$law_oc")"
          lawmaking_oc_encoded="$(urlencode "$LAWMAKING_OC")"
          gwanbo_key_encoded="$(urlencode "$DATA_GO_KR_SERVICE_KEY")"

          cat > /tmp/probe_urls.tsv <<EOF
          law.go.kr lsHstInf	https://www.law.go.kr/DRF/lawSearch.do?OC=${law_oc_encoded}&target=lsHstInf&type=JSON&display=1&page=1&regDt=${ymd}
          law.go.kr lsJoHstInf	https://www.law.go.kr/DRF/lawSearch.do?OC=${law_oc_encoded}&target=lsJoHstInf&type=JSON&display=1&page=1&regDt=${ymd}
          lawmaking ogLmPp	${lawmaking_base}/ogLmPp.xml?OC=${lawmaking_oc_encoded}&cptOfiOrgCd=1170000&stYdFmt=${dot_date}&edYdFmt=${dot_date}
          lawmaking ptcpAdmPp	${lawmaking_base}/ptcpAdmPp.xml?OC=${lawmaking_oc_encoded}&asndOfiNm=%EB%B2%95%EC%A0%9C%EC%B2%98&stYdFmt=${dot_date}&edYdFmt=${dot_date}
          gwanbo list	${gwanbo_base}?serviceKey=${gwanbo_key_encoded}&pageNo=1&pageSize=1&numOfRows=1&reqFrom=${ymd}&reqTo=${ymd}&fromDate=${ymd}&toDate=${ymd}&type=1
          MOIS board	https://www.mois.go.kr/frt/bbs/type001/commonSelectBoardList.do?bbsId=BBSMSTR_000000000016
          MOEF board	https://mofe.go.kr/com/bbs/ComtnbbsList.do?bbsId=MOSFBBS_000000000059&menuNo=7080200
          MOTIR board	https://www.motir.go.kr/kor/article/ATCL0c554f816
          ALIO law list	https://www.alio.go.kr/etc/findEtcLawList.json?type=title&pageNo=1
          Korea RSS	https://www.korea.kr/rss/pressrelease.xml
          EOF

          echo "## curl probes"
          while IFS=$'\t' read -r label url; do
            [ -z "$label" ] && continue
            out="$(curl -L -4 --http1.1 --connect-timeout 10 --max-time 20 -A 'kr-reg-change-watch/diagnostic' -sS -o /tmp/probe_body -w 'http=%{http_code} time=%{time_total} size=%{size_download} type=%{content_type}' "$url" 2>&1)"
            body="$(head -c 160 /tmp/probe_body | tr '\n\r\t' '   ')"
            echo "[$label] $out body=${body}"
          done < /tmp/probe_urls.tsv

          echo ""
          echo "## node fetch probes"
          node <<'NODE'
          const fs = require("node:fs");
          const lines = fs.readFileSync("/tmp/probe_urls.tsv", "utf8").split(/\r?\n/).filter(Boolean);
          const headers = {
            "user-agent": "kr-reg-change-watch/diagnostic",
            "accept": "application/json, application/xml, text/xml, text/html;q=0.9, */*;q=0.8",
            "accept-language": "ko-KR,ko;q=0.9,en;q=0.8"
          };
          (async () => {
            for (const line of lines) {
              const [label, url] = line.split("\t");
              const controller = new AbortController();
              const timeout = setTimeout(() => controller.abort(), 20000);
              const start = Date.now();
              try {
                const response = await fetch(url, { headers, signal: controller.signal });
                const text = await response.text();
                const body = text.slice(0, 160).replace(/[\r\n\t]+/g, " ");
                console.log(`[${label}] ok=${response.ok} status=${response.status} time=${Date.now() - start}ms size=${text.length} type=${response.headers.get("content-type") || ""} body=${body}`);
              } catch (error) {
                console.log(`[${label}] error=${error && error.name ? error.name : "Error"} message=${error && error.message ? error.message : String(error)} time=${Date.now() - start}ms`);
              } finally {
                clearTimeout(timeout);
              }
            }
          })();
          NODE
