name: Email alert test

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "테스트할 수집 날짜(YYYY-MM-DD)."
        required: true
        type: string
        default: "2026-06-01"
      force_collect:
        description: "이미 캐시가 있어도 다시 수집합니다."
        required: false
        type: boolean
        default: true
      commit_data:
        description: "수집 결과를 data 폴더에 커밋합니다."
        required: false
        type: boolean
        default: true
      mail_to_override:
        description: "테스트 수신 이메일. 비우면 Secret의 구독 설정을 사용합니다."
        required: false
        type: string
      dry_run:
        description: "메일을 실제로 보내지 않고 매칭 결과만 확인합니다."
        required: false
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

concurrency:
  group: email-alert-test
  cancel-in-progress: false

jobs:
  collect-and-send:
    runs-on: ubuntu-latest
    env:
      LAW_OPEN_API_OC: ${{ secrets.LAW_OPEN_API_OC }}
      LAW_OC: ${{ secrets.LAW_OC }}
      KOREAN_LAW_API_KEY: ${{ secrets.KOREAN_LAW_API_KEY }}
      LAWMAKING_OC: ${{ secrets.LAWMAKING_OC }}
      LAWMAKING_BASE: https://www.lawmaking.go.kr/rest
      GWANBO_LIST_URL: ${{ secrets.GWANBO_LIST_URL }}
      DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      MAIL_FROM_EMAIL: ${{ secrets.MAIL_FROM_EMAIL }}
      MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      MAIL_SUBSCRIPTIONS_JSON: ${{ secrets.MAIL_SUBSCRIPTIONS_JSON }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
      MAIL_UNSUBSCRIBE_EMAILS: ${{ secrets.MAIL_UNSUBSCRIBE_EMAILS }}
      SUBSCRIPTION_API_URL: ${{ secrets.SUBSCRIPTION_API_URL }}
      SUBSCRIBER_READ_TOKEN: ${{ secrets.SUBSCRIBER_READ_TOKEN }}
      MAIL_BASE_URL: https://brightash.github.io/kr-reg-change-watch
      MAIL_TO_OVERRIDE: ${{ github.event.inputs.mail_to_override }}
      MAIL_DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
      MAIL_REQUIRE_RECIPIENT: "1"
      TARGET_DATE: ${{ github.event.inputs.target_date }}
      FORCE_COLLECT: ${{ github.event.inputs.force_collect == 'true' && '1' || '0' }}
      COMMIT_DATA: ${{ github.event.inputs.commit_data == 'true' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Install ALIO attachment extractor dependencies
        run: python3 -m pip install --user olefile pypdf

      - name: Collect target date
        run: |
          if [ "$FORCE_COLLECT" = "1" ]; then
            npm run collect -- --date "$TARGET_DATE" --force
          else
            npm run collect -- --date "$TARGET_DATE"
          fi

      - name: Commit collected data
        if: github.event.inputs.commit_data == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add data
          if git diff --cached --quiet; then
            echo "No collected data changes to commit."
          else
            git commit -m "Collect regulatory changes for ${TARGET_DATE}"
            git push
          fi

      - name: Send test mail alert
        run: npm run mail:send -- --date "$TARGET_DATE"
