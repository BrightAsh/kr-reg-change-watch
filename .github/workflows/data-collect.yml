name: Data collect and deploy

run-name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target_date != '' && format('Data collect {0}', github.event.inputs.target_date) || 'Data collect and deploy' }}

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "데이터 전용 수집 날짜(YYYY-MM-DD). 비우면 한국시간 기준 전일을 수집합니다."
        required: false
        type: string
      start_date:
        description: "데이터 전용 백필 시작일(YYYY-MM-DD). end_date와 함께 입력하면 날짜 범위로 수집합니다."
        required: false
        type: string
      end_date:
        description: "데이터 전용 백필 종료일(YYYY-MM-DD). start_date와 함께 입력하면 날짜 범위로 수집합니다."
        required: false
        type: string
      collection_order:
        description: "날짜 범위 수집 순서입니다. asc 또는 reverse."
        required: false
        type: choice
        options:
          - asc
          - reverse
        default: asc
      force:
        description: "이미 일자별 데이터 캐시가 있어도 다시 수집합니다."
        required: false
        type: boolean
        default: false
      deploy_site:
        description: "수집 후 웹사이트를 빌드/배포합니다. 테스트 수집만 확인할 때는 false로 실행합니다."
        required: false
        type: boolean
        default: true
      commit_data:
        description: "수집된 data/data 변경분을 커밋합니다."
        required: false
        type: boolean
        default: true
      network_retry_count:
        description: "Internal fresh-run retry count for data source network blocks."
        required: false
        type: string
        default: "0"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  actions: write
  contents: write
  pages: write
  id-token: write

concurrency:
  group: data-collect-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  data-collect-build-deploy:
    runs-on: ubuntu-22.04
    permissions:
      actions: write
      contents: write
      pages: write
      id-token: write
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_site == 'false' && 'collection-test' || 'github-pages' }}
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      LAW_OPEN_API_OC: ${{ secrets.LAW_OPEN_API_OC }}
      LAW_OC: ${{ secrets.LAW_OC }}
      KOREAN_LAW_API_KEY: ${{ secrets.KOREAN_LAW_API_KEY }}
      LAWMAKING_OC: ${{ secrets.LAWMAKING_OC }}
      LAWMAKING_BASE: https://www.lawmaking.go.kr/rest
      GWANBO_LIST_URL: ${{ secrets.GWANBO_LIST_URL }}
      DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
      NEXT_PUBLIC_BASE_PATH: /kr-reg-change-watch
      FETCH_LOOKBACK_DAYS: 1
      DATA_FETCH_LOOKBACK_DAYS: 1
      FETCH_RETRIES: 2
      FETCH_TIMEOUT_MS: 60000
      DATA_PREFLIGHT_FAILED_FETCH_RETRIES: 1
      DATA_PREFLIGHT_FAILED_FETCH_TIMEOUT_MS: 15000
      FETCH_CURL_FALLBACK: 1
      FETCH_CURL_FIRST: 1
      FETCH_CURL_ONLY: 0
      DATA_FETCH_MAX_PAGES: 20
      DATA_FETCH_DETAIL_LIMIT: 40
      DATA_PREFLIGHT_ATTEMPTS: 2
      DATA_PREFLIGHT_RETRY_DELAY_SECONDS: 60
      MAX_DATA_NETWORK_PREFLIGHT_RETRIES: 10
      TARGET_DATE: ${{ github.event.inputs.target_date }}
      START_DATE: ${{ github.event.inputs.start_date }}
      END_DATE: ${{ github.event.inputs.end_date }}
      COLLECTION_ORDER: ${{ github.event.inputs.collection_order }}
      PUSH_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
      FORCE_COLLECT: ${{ github.event_name == 'push' && '1' || github.event.inputs.force == 'true' && '1' || '0' }}
      DEPLOY_SITE: ${{ github.event_name != 'workflow_dispatch' && '1' || github.event.inputs.deploy_site != 'false' && '1' || '0' }}
      COMMIT_DATA: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.commit_data == 'false' && '0' || '1' }}
      NETWORK_RETRY_COUNT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.network_retry_count || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Sync latest branch before collection
        run: git pull --ff-only origin "${GITHUB_REF_NAME:-main}"

      - name: Resolve data collection inputs
        shell: bash
        run: |
          set -euo pipefail

          resolved_target="${TARGET_DATE:-}"
          resolved_start="${START_DATE:-}"
          resolved_end="${END_DATE:-}"
          resolved_force="${FORCE_COLLECT:-0}"
          resolved_backfill=0
          resolved_collection_order="${COLLECTION_ORDER:-asc}"

          if [ "${GITHUB_EVENT_NAME:-}" = "push" ] && [ -z "$resolved_target" ] && [ -z "$resolved_start" ] && [ -z "$resolved_end" ]; then
            if [[ "${PUSH_COMMIT_MESSAGE:-}" =~ \[data-backfill[[:space:]]+([0-9]{4}-[0-9]{2}-[0-9]{2})\.\.([0-9]{4}-[0-9]{2}-[0-9]{2})\] ]]; then
              resolved_start="${BASH_REMATCH[1]}"
              resolved_end="${BASH_REMATCH[2]}"
              resolved_force=0
              resolved_backfill=1
              resolved_collection_order=asc
              echo "Resolved data backfill range from push commit message: ${resolved_start}..${resolved_end}"
            fi
          fi

          if [ "$resolved_collection_order" != "reverse" ]; then
            resolved_collection_order=asc
          fi

          if [ -n "$resolved_target" ] && { [ -n "$resolved_start" ] || [ -n "$resolved_end" ]; }; then
            echo "::error::target_date cannot be combined with start_date/end_date."
            exit 1
          fi

          if [ -n "$resolved_start" ] || [ -n "$resolved_end" ]; then
            if [ -z "$resolved_start" ] || [ -z "$resolved_end" ]; then
              echo "::error::start_date and end_date must be provided together."
              exit 1
            fi
            start_epoch="$(date -u -d "$resolved_start" +%s)"
            end_epoch="$(date -u -d "$resolved_end" +%s)"
            if [ "$start_epoch" -gt "$end_epoch" ]; then
              echo "::error::start_date must be on or before end_date."
              exit 1
            fi
          fi

          if [ -n "$resolved_target" ]; then
            date -u -d "$resolved_target" +%F >/dev/null
          fi

          {
            echo "RESOLVED_TARGET_DATE=$resolved_target"
            echo "RESOLVED_START_DATE=$resolved_start"
            echo "RESOLVED_END_DATE=$resolved_end"
            echo "RESOLVED_FORCE_COLLECT=$resolved_force"
            echo "RESOLVED_BACKFILL=$resolved_backfill"
            echo "RESOLVED_COLLECTION_ORDER=$resolved_collection_order"
          } >> "$GITHUB_ENV"

      - name: Preflight data source connectivity
        id: data_preflight
        continue-on-error: true
        shell: bash
        run: |
          set +e
          PREFLIGHT_DATE="${RESOLVED_TARGET_DATE:-${RESOLVED_START_DATE:-}}"
          if [ -n "$PREFLIGHT_DATE" ]; then
            YMD="$(date -u -d "$PREFLIGHT_DATE" +%Y%m%d)"
            DOT_DATE="$(date -u -d "$PREFLIGHT_DATE" +%-Y.%-m.%-d.)"
          else
            YMD="$(TZ=Asia/Seoul date -d 'yesterday' +%Y%m%d)"
            DOT_DATE="$(TZ=Asia/Seoul date -d 'yesterday' +%-Y.%-m.%-d.)"
          fi

          LAW_OC_VALUE="${LAW_OPEN_API_OC:-${LAW_OC:-${KOREAN_LAW_API_KEY:-}}}"
          PREFLIGHT_ATTEMPTS="${DATA_PREFLIGHT_ATTEMPTS:-2}"
          PREFLIGHT_RETRY_DELAY_SECONDS="${DATA_PREFLIGHT_RETRY_DELAY_SECONDS:-60}"
          if ! [[ "$PREFLIGHT_ATTEMPTS" =~ ^[0-9]+$ ]] || [ "$PREFLIGHT_ATTEMPTS" -lt 1 ]; then
            PREFLIGHT_ATTEMPTS=1
          fi
          if ! [[ "$PREFLIGHT_RETRY_DELAY_SECONDS" =~ ^[0-9]+$ ]]; then
            PREFLIGHT_RETRY_DELAY_SECONDS=60
          fi

          probe_url() {
            local label="$1"
            local url="$2"
            PROBE_COUNT=$((PROBE_COUNT + 1))
            echo "Checking ${label}"
            curl -4 -L --http1.1 --connect-timeout 8 --max-time 25 --retry 1 --retry-all-errors -sS --fail \
              -o /tmp/data-preflight.out \
              -A "Mozilla/5.0 (compatible; kr-reg-change-watch/0.1; +https://github.com/BrightAsh/kr-reg-change-watch)" \
              -H "accept: application/json, application/xml, text/xml, text/html;q=0.9, */*;q=0.8" \
              -H "accept-language: ko-KR,ko;q=0.9,en;q=0.8" \
              "$url"
            local code=$?
            local bytes=0
            if [ -f /tmp/data-preflight.out ]; then
              bytes=$(wc -c < /tmp/data-preflight.out | tr -d ' ')
            fi
            rm -f /tmp/data-preflight.out
            if [ "$code" -eq 0 ]; then
              echo "OK ${label} bytes=${bytes}"
            else
              echo "FAIL ${label} curl_exit=${code}"
              FAIL_COUNT=$((FAIL_COUNT + 1))
              FAILED_LABELS+=("${label}")
            fi
          }

          run_preflight_round() {
            FAIL_COUNT=0
            PROBE_COUNT=0
            FAILED_LABELS=()
            if [ -n "$LAW_OC_VALUE" ]; then
              probe_url "law.go.kr" "https://www.law.go.kr/DRF/lawSearch.do?OC=${LAW_OC_VALUE}&target=law&type=JSON&display=1&page=1&query=%EB%8D%B0%EC%9D%B4%ED%84%B0"
            else
              echo "::warning::LAW_OPEN_API_OC/LAW_OC/KOREAN_LAW_API_KEY is not configured; law.go.kr preflight skipped."
            fi
            probe_url "opinion.lawmaking.go.kr" "https://opinion.lawmaking.go.kr/gcom/ogLmPp?stYdFmt=${DOT_DATE}&edYdFmt=${DOT_DATE}&lsNm=%EB%8D%B0%EC%9D%B4%ED%84%B0&isOgYn=Y&opYn=Y"
            if [ -n "$GWANBO_LIST_URL" ] && [ -n "$DATA_GO_KR_SERVICE_KEY" ]; then
              GWANBO_SEPARATOR="?"
              case "$GWANBO_LIST_URL" in
                *\?*) GWANBO_SEPARATOR="&" ;;
              esac
              probe_url "open.gwanbo.go.kr" "${GWANBO_LIST_URL}${GWANBO_SEPARATOR}serviceKey=${DATA_GO_KR_SERVICE_KEY}&pageNo=1&pageSize=1&numOfRows=1&reqFrom=${YMD}&reqTo=${YMD}"
            else
              echo "::warning::GWANBO_LIST_URL/DATA_GO_KR_SERVICE_KEY is not configured; gwanbo preflight skipped."
            fi
            probe_url "msit.go.kr" "https://www.msit.go.kr/bbs/list.do?sCode=user&mPid=103&mId=108"
            probe_url "kdata.or.kr" "https://www.kdata.or.kr/kr/board/promotion_01/boardList.do"
            probe_url "data1window.kr" "https://www.data1window.kr/vrest/api/v1/resource/post/list?limit=1&offset=0&bbsTypeCd=001&searchValue="
            probe_url "mois.go.kr" "https://www.mois.go.kr/frt/bbs/type001/commonSelectBoardList.do?bbsId=BBSMSTR_000000000016"
            probe_url "mods.go.kr" "https://mods.go.kr/menu.es?mid=a10403040000"
            probe_url "data.go.kr" "https://www.data.go.kr/bbs/ntc/selectNoticeListView.do"
          }

          round=1
          while [ "$round" -le "$PREFLIGHT_ATTEMPTS" ]; do
            echo "Data source preflight attempt ${round}/${PREFLIGHT_ATTEMPTS}"
            run_preflight_round
            if [ "$FAIL_COUNT" -eq 0 ]; then
              echo "Data source preflight passed for ${PROBE_COUNT} URL(s)."
              exit 0
            fi
            if [ "$round" -lt "$PREFLIGHT_ATTEMPTS" ]; then
              echo "::warning::Data source preflight failed for ${FAIL_COUNT}/${PROBE_COUNT} URL(s); retrying in ${PREFLIGHT_RETRY_DELAY_SECONDS}s."
              sleep "$PREFLIGHT_RETRY_DELAY_SECONDS"
            fi
            round=$((round + 1))
          done

          failed_labels="$(IFS=,; echo "${FAILED_LABELS[*]}")"
          echo "::warning::Data source preflight failed for ${FAIL_COUNT}/${PROBE_COUNT} URL(s): ${failed_labels}. Continuing so reachable sources can still be collected and route-level errors can be logged."
          echo "failed_labels=${failed_labels}" >> "$GITHUB_OUTPUT"
          echo "FETCH_RETRIES=${DATA_PREFLIGHT_FAILED_FETCH_RETRIES:-1}" >> "$GITHUB_ENV"
          echo "FETCH_TIMEOUT_MS=${DATA_PREFLIGHT_FAILED_FETCH_TIMEOUT_MS:-15000}" >> "$GITHUB_ENV"
          exit 0

      - name: Queue fresh runner retry after data preflight network block
        if: ${{ steps.data_preflight.outputs.network_blocked == '1' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          retry_count="${NETWORK_RETRY_COUNT:-0}"
          if ! [[ "$retry_count" =~ ^[0-9]+$ ]]; then
            retry_count=0
          fi
          max_retries="${MAX_DATA_NETWORK_PREFLIGHT_RETRIES:-3}"
          if ! [[ "$max_retries" =~ ^[0-9]+$ ]]; then
            max_retries=3
          fi
          if [ "$retry_count" -ge "$max_retries" ]; then
            echo "::warning::Data preflight network block persisted after ${retry_count} fresh-run retry attempt(s). Not queueing another run."
            exit 0
          fi

          retry_target="${RESOLVED_TARGET_DATE:-}"
          if [ -z "$retry_target" ] && [ -z "${RESOLVED_START_DATE:-}" ]; then
            retry_target="$(TZ=Asia/Seoul date -d 'yesterday' +%Y-%m-%d)"
          fi
          next_retry_count=$((retry_count + 1))

          if [ -n "$retry_target" ] && [ -f "data/data/daily/${retry_target}.json" ]; then
            export RETRY_TARGET_FOR_CACHE="$retry_target"
            if node <<'JS'
          const fs = require("node:fs");
          const path = require("node:path");
          const date = process.env.RETRY_TARGET_FOR_CACHE;
          const dailyPath = path.join("data", "data", "daily", `${date}.json`);
          const daily = JSON.parse(fs.readFileSync(dailyPath, "utf8"));
          process.exit(daily?.date === date && Array.isArray(daily.logs) && daily.logs.length > 0 && daily.logs.every((log) => log.status === "ok") ? 0 : 1);
          JS
            then
              echo "Data collection cache for ${retry_target} is already complete. Not queueing another fresh-run retry."
              exit 0
            fi
          fi

          export RETRY_TARGET="$retry_target"
          export RETRY_START="${RESOLVED_START_DATE:-}"
          export RETRY_END="${RESOLVED_END_DATE:-}"
          export RETRY_COLLECTION_ORDER="${RESOLVED_COLLECTION_ORDER:-asc}"
          export NEXT_RETRY_COUNT="$next_retry_count"
          export RETRY_FORCE_COLLECT="$([ "${RESOLVED_FORCE_COLLECT:-0}" = "1" ] && echo true || echo false)"
          export RETRY_DEPLOY_SITE="$([ "${DEPLOY_SITE:-0}" = "1" ] && echo true || echo false)"
          export RETRY_COMMIT_DATA="$([ "${COMMIT_DATA:-0}" = "1" ] && echo true || echo false)"
          python3 - <<'PY' > /tmp/data-fresh-run-retry.json
          import json
          import os

          inputs = {
              "target_date": os.environ.get("RETRY_TARGET", ""),
              "start_date": os.environ.get("RETRY_START", ""),
              "end_date": os.environ.get("RETRY_END", ""),
              "collection_order": os.environ.get("RETRY_COLLECTION_ORDER", "asc"),
              "force": os.environ["RETRY_FORCE_COLLECT"],
              "deploy_site": os.environ["RETRY_DEPLOY_SITE"],
              "commit_data": os.environ["RETRY_COMMIT_DATA"],
              "network_retry_count": os.environ["NEXT_RETRY_COUNT"],
          }
          print(json.dumps({"ref": os.environ.get("GITHUB_REF_NAME", "main"), "inputs": inputs}, separators=(",", ":")))
          PY

          echo "Queueing data fresh-run retry ${next_retry_count}/${max_retries}."
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/data-collect.yml/dispatches" \
            --data @/tmp/data-fresh-run-retry.json

      - name: Stop after failed data preflight
        if: ${{ steps.data_preflight.outputs.failed == '1' }}
        run: exit 1

      - name: Collect data-specific changes
        id: data_collect
        run: |
          set -e
          collect_one_date() {
            local date_value="$1"
            local args=(--date "$date_value")
            if [ "${RESOLVED_FORCE_COLLECT:-0}" = "1" ]; then
              args+=(--force)
            fi
            npm run data:collect -- "${args[@]}"
            npm run data:verify -- --date "$date_value" --allow-external-errors
          }

          if [ -n "${RESOLVED_START_DATE:-}" ] || [ -n "${RESOLVED_END_DATE:-}" ]; then
            if [ -z "${RESOLVED_START_DATE:-}" ] || [ -z "${RESOLVED_END_DATE:-}" ]; then
              echo "::error::start_date and end_date must be provided together."
              exit 1
            fi
            if [ "${RESOLVED_COLLECTION_ORDER:-asc}" = "reverse" ]; then
              cursor="$RESOLVED_END_DATE"
              stop_epoch="$(date -u -d "$RESOLVED_START_DATE" +%s)"
              step="- 1 day"
              compare_epoch() { [ "$1" -ge "$2" ]; }
              echo "Collecting data range in reverse order: ${RESOLVED_END_DATE}..${RESOLVED_START_DATE}"
            else
              cursor="$RESOLVED_START_DATE"
              stop_epoch="$(date -u -d "$RESOLVED_END_DATE" +%s)"
              step="+ 1 day"
              compare_epoch() { [ "$1" -le "$2" ]; }
              echo "Collecting data range in ascending order: ${RESOLVED_START_DATE}..${RESOLVED_END_DATE}"
            fi
            failures=()
            mkdir -p data/data/logs/backfill
            while compare_epoch "$(date -u -d "$cursor" +%s)" "$stop_epoch"; do
              if collect_one_date "$cursor"; then
                echo "Data collection complete for ${cursor}."
              else
                echo "::error::Data collection failed for ${cursor}. Continuing range collection so diagnostics can be committed."
                failures+=("$cursor")
                if [ -f data/data/logs/last-fetch.json ]; then
                  cp data/data/logs/last-fetch.json "data/data/logs/backfill/${cursor}.json"
                fi
                npm run data:status || true
              fi
              cursor="$(date -u -d "$cursor $step" +%F)"
            done
            if [ "${#failures[@]}" -gt 0 ]; then
              printf '%s\n' "${failures[@]}" > data/data/logs/backfill-failed-dates.txt
              python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          failed_dates = Path("data/data/logs/backfill-failed-dates.txt").read_text(encoding="utf-8").splitlines()
          payload = {
              "failed_dates": failed_dates,
              "failed_count": len(failed_dates),
              "start_date": os.environ.get("RESOLVED_START_DATE", ""),
              "end_date": os.environ.get("RESOLVED_END_DATE", ""),
          }
          Path("data/data/logs/backfill-failures.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
              echo "DATA_RANGE_FAILED=1" >> "$GITHUB_ENV"
              echo "::error::Data range collection failed for ${#failures[@]} date(s): ${failures[*]}"
            else
              rm -f data/data/logs/backfill-failed-dates.txt data/data/logs/backfill-failures.json
            fi
          elif [ -n "${RESOLVED_TARGET_DATE:-}" ]; then
            if collect_one_date "$RESOLVED_TARGET_DATE"; then
              echo "Data collection complete for ${RESOLVED_TARGET_DATE}."
            else
              echo "::error::Data collection failed for ${RESOLVED_TARGET_DATE}. Continuing so collected data and diagnostics can be committed."
              mkdir -p data/data/logs/backfill
              if [ -f data/data/logs/last-fetch.json ]; then
                cp data/data/logs/last-fetch.json "data/data/logs/backfill/${RESOLVED_TARGET_DATE}.json"
              fi
              printf '%s\n' "$RESOLVED_TARGET_DATE" > data/data/logs/backfill-failed-dates.txt
              python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          target_date = os.environ.get("RESOLVED_TARGET_DATE", "")
          payload = {
              "failed_dates": [target_date] if target_date else [],
              "failed_count": 1 if target_date else 0,
              "target_date": target_date,
          }
          Path("data/data/logs/backfill-failures.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
              npm run data:status || true
              echo "DATA_TARGET_FAILED=1" >> "$GITHUB_ENV"
            fi
          else
            COLLECT_ARGS=()
            if [ "${RESOLVED_FORCE_COLLECT:-0}" = "1" ]; then
              COLLECT_ARGS+=(--force)
            fi
            auto_failed=0
            if [ "${#COLLECT_ARGS[@]}" -gt 0 ]; then
              npm run data:collect -- "${COLLECT_ARGS[@]}" || auto_failed=1
            else
              npm run data:collect || auto_failed=1
            fi
            if [ "$auto_failed" -eq 0 ]; then
              npm run data:verify -- --allow-external-errors || auto_failed=1
            fi
            if [ "$auto_failed" -eq 0 ]; then
              echo "Data collection complete for auto target."
            else
              echo "::error::Data collection failed for auto target. Continuing so collected data and diagnostics can be committed."
              npm run data:status || true
              echo "DATA_TARGET_FAILED=1" >> "$GITHUB_ENV"
            fi
          fi

      - name: Update data collection status
        if: ${{ always() }}
        run: npm run data:status

      - name: Commit data-specific collection
        if: ${{ env.COMMIT_DATA == '1' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm run data:status
          if grep -R -n -E '^(<<<<<<<|=======|>>>>>>>)' data/data 2>/dev/null; then
            echo "::error::Conflict markers found in generated data files."
            exit 1
          fi
          git add data/data
          if git diff --cached --quiet; then
            echo "No data-specific collection changes to commit."
          else
            if [ -n "${RESOLVED_START_DATE:-}" ]; then
              DATE_LABEL="${RESOLVED_START_DATE}_to_${RESOLVED_END_DATE}"
            else
              DATE_LABEL="${RESOLVED_TARGET_DATE:-auto}"
            fi
            git commit -m "Collect data regulatory changes for ${DATE_LABEL}"
            for push_attempt in 1 2 3; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}"
              if git push; then
                break
              fi
              if [ "$push_attempt" -eq 3 ]; then
                echo "::error::Failed to push data-specific collection after ${push_attempt} attempts."
                exit 1
              fi
              sleep $((push_attempt * 10))
            done
          fi

      - name: Build static website
        if: ${{ env.DEPLOY_SITE == '1' }}
        run: npm run build

      - uses: actions/configure-pages@v5
        if: ${{ env.DEPLOY_SITE == '1' }}

      - uses: actions/upload-pages-artifact@v3
        if: ${{ env.DEPLOY_SITE == '1' }}
        with:
          path: out

      - id: deployment
        if: ${{ env.DEPLOY_SITE == '1' }}
        uses: actions/deploy-pages@v4

      - name: Fail if data collection failed
        if: ${{ env.DATA_RANGE_FAILED == '1' || env.DATA_TARGET_FAILED == '1' }}
        run: exit 1

