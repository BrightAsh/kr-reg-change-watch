name: MOTIR backfill

on:
  workflow_dispatch:
    inputs:
      date_range_start:
        description: "산업통상부 수집 시작일(YYYY-MM-DD)"
        required: true
        type: string
      date_range_end:
        description: "산업통상부 수집 종료일(YYYY-MM-DD)"
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      NEXT_PUBLIC_BASE_PATH: /kr-reg-change-watch
      NEXT_PUBLIC_SUBSCRIPTION_API_URL: ${{ secrets.SUBSCRIPTION_API_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Backfill MOTIR range
        run: npx tsx scripts/backfill-motir-range.ts --start "${{ github.event.inputs.date_range_start }}" --end "${{ github.event.inputs.date_range_end }}"

      - name: Commit MOTIR backfill data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add data
          if git diff --cached --quiet; then
            echo "No MOTIR backfill data changes to commit."
          else
            git commit -m "Backfill MOTIR changes for ${{ github.event.inputs.date_range_start }} to ${{ github.event.inputs.date_range_end }}"
            git push
          fi

      - name: Build static app
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - id: deployment
        uses: actions/deploy-pages@v4
